# Lint and format settings for the published Connector source.
#
# Repository-local, and deliberately not a copy of the canonical repository's configuration: that
# one is monorepo-wide and most of it is per-file exceptions for applications, migrations and
# operator scripts that do not exist here. What is reproduced is exactly the part that applies to
# `src/agentnexus_sdk/**`, so that "clean here" and "clean there" mean the same thing for this
# source. None of the canonical per-file ignores touches this package.
#
# If the two ever disagree, the canonical repository is right and this file is the bug.
target-version = "py313"
line-length = 100
extend-exclude = [".venv", ".venv-tools", "dist", "build"]

[lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtins shadowing
    "C4",          # comprehensions
    "DTZ",         # timezone-aware datetimes
    "S",           # bandit security rules
    "SIM",         # simplify
    "TID",         # tidy imports
    "RUF",         # ruff-specific
    "D",           # docstrings
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[lint.per-file-ignores]
# The governance guard asserts, which is what a test does. `S101` exists to stop `assert` being
# used as a runtime check in shipped code, and nothing under `ci/` is shipped: the wheel is built
# from `src/agentnexus_sdk/**`. Scoped to test files rather than to the whole directory, so
# `ci/verify_release.py` -- which does run as a program -- keeps the rule.
"ci/test_*.py" = ["S101"]

[lint.pydocstyle]
convention = "pep257"

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[format]
docstring-code-format = true
