# The gate for the public Connector.
#
# This repository exists so that somebody asked to run the Connector beside their own private key
# can read it first. A repository nobody checks is only half of that, so these are the checks such
# a reader would otherwise run themselves: it builds, it installs, every module imports, it
# type-checks, it has no obvious static security fault, its dependencies carry no known advisory,
# nothing in it looks like a credential, and nothing has been added to it that is not declared.
#
# ## Constraints, not a lockfile
#
# `pyproject.toml` declares dependency *ranges* on purpose: this is a library installed next to
# somebody else's dependencies, and an exact pin would force a resolver conflict on them for no
# safety gain. The pins therefore live in `constraints-ci.txt`, which fixes what *this workflow*
# resolves without narrowing what a consumer may install. A range that drifts into something broken
# fails here, on the weekly run, rather than on an operator's machine.
#
# ## What it deliberately does not do
#
# No secret, no credential, no publication, no release, no signing, and `contents: read` only.
#
# It does not run the package's own test suite, because that suite is not in this repository: its
# fixtures carry synthetic identities, profile layouts and invitation shapes, and publishing them
# would put material here that the export audit refuses. Making them publishable is separate work.
# So this proves the source builds, installs, imports, type-checks and is clean. It does not prove
# the software behaves correctly — a different claim, which is not made here.
#
# There is no second copy of this source elsewhere to compare it against: this repository owns
# `src/agentnexus_sdk/**`. Nothing here reads another repository, and no cross-repository
# credential exists or is created. See `docs/MIRROR.md` for what this repository publishes.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Dependency advisories arrive without anybody pushing. Weekly, Monday morning UTC.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, type-check and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out this repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The whole history, because a release is reproduced from the commit it was built from,
          # and that commit is an ancestor of the one being checked rather than the one itself.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # `requires-python = ">=3.13,<3.14"`. Building on anything else would not produce the
          # distribution operators are served.
          python-version: '3.13'

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r constraints-ci.txt

      - name: Lint
        run: ruff check .

      - name: Formatter
        run: ruff format --check .

      # What this repository says about where work is tracked, checked rather than trusted. It
      # rots silently: nothing breaks when the tracker named here goes stale, a contributor just
      # opens an Issue in a repository nobody watches. Reads local files only -- no network, no
      # credential, no other repository -- so it runs before anything is built
      # (agntnexus/agentnexus#46).
      - name: The governance this repository states about itself
        run: python -m pytest ci/test_governance.py -q

      - name: What this repository owns, and where a fix to it belongs
        # The same kind of rot as the tracker above, one layer down: these documents used to hand
        # `src/agentnexus_sdk/**` to a private repository nobody may change any more, so a reader
        # who believed them would take a fix somewhere it could not be made.
        # Ownership was settled by owner decision under agntnexus/agentnexus#5; this refuses the
        # sentence coming back, and refuses losing the release-integrity rules while correcting it.
        # Local files only, so it runs before anything is built.
        run: python -m pytest ci/test_source_ownership.py -q

      - name: Build the distribution
        run: python -m build

      - name: Install the built wheel and import every module
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          python -m pip install "${wheel}"
          python - <<'PY'
          import importlib
          import pkgutil

          import agentnexus_sdk

          names = sorted(module.name for module in pkgutil.iter_modules(agentnexus_sdk.__path__))
          for name in names:
              importlib.import_module(f"agentnexus_sdk.{name}")
          print(f"{len(names)} modules imported from the built wheel")
          PY

      - name: Termux/Android support, and a release chain that still refuses
        # Run against the wheel installed by the step above rather than against the source tree,
        # because an operator installs a wheel and the platform decision these cases check is made
        # at import time inside it.
        #
        # The first file covers the platform work itself: a Termux device is recognised from what
        # the interpreter and the device are, no environment variable can claim a platform, every
        # other platform is left untouched, and the preload runs before the first native import.
        # The second is the other half of agntnexus/agentnexus#5 -- the fix must not have cost the
        # release chain anything, so the signature, the manifest, the artifact, the key and the
        # origin are each mutated in memory and a refusal is required for every one.
        run: python -m pytest ci/test_termux_support.py ci/test_release_verification.py -q

      - name: The release builder refuses what it must
        # `scripts/build_release.py` is the one file here that can hold a private signing key, so
        # its refusals are worth more than its output: a key inside a work tree, an unstamped
        # updater, versions that disagree, an epoch that is not the commit's, two builds that
        # differ, a damaged release tree and any private material in the output. The end-to-end
        # cases build a real release in a throwaway clone with a throwaway key generated by the
        # test, then reproduce it with no key at all. No release key exists in this job.
        run: python -m pytest ci/test_build_release.py -q

      - name: The committed release is what its source commit builds
        # Rebuilds the wheel the committed manifest names from the source commit recorded for it,
        # with that commit's own time as SOURCE_DATE_EPOCH, and requires the result to be byte for
        # byte the committed wheel -- then requires the tree to be the previous release plus this
        # one, signed by the key the loaders already carry. The coordinates come from the
        # committed loaders; nothing here holds or needs a private key. Releases built before the
        # builder existed are named as such and not rebuilt.
        run: python scripts/build_release.py reproduce

      - name: The published release verifies from published data alone
        # This repository now owns what an installation downloads, so it owns the promise that the
        # download is checkable -- and a promise nobody checks is not one. The public P-256
        # coordinates stamped into the loaders verify the signature over the manifest, the manifest
        # declares the artifact's size and SHA-256, and the artifact on disk has to match both.
        #
        # It also compares each released loader against its source in `installers/`: "stamped with a
        # public key" is a claim worth measuring, and the only permitted difference is the two
        # coordinate lines.
        #
        # `cryptography` is available because the step above installed the built wheel, which
        # depends on it. Nothing here signs anything -- a private key would let CI *create* a
        # release, which is exactly what it must never be able to do.
        run: python ci/verify_release.py

      - name: Type check
        run: mypy src/agentnexus_sdk

      - name: Static security analysis
        # Bandit's rules, run through ruff as `S`, which is how this source enforces them. Named
        # as its own step rather than left implicit inside `ruff check .`, because a security
        # gate a reader cannot see is not much of one.
        #
        # Deliberately not standalone bandit as well. This source carries reviewed suppressions —
        # `# noqa: S104` on a set of loopback origins recognised as *data*, `# noqa: S603` on a
        # subprocess call whose argv is operator configuration and never model input — and bandit
        # does not read them. Running both would fail this repository on findings the canonical
        # repository has already adjudicated, which is a gate disagreeing with itself rather than
        # a second opinion.
        run: ruff check --select S .

      - name: Dependency advisories
        # Audits the dependency ranges `pyproject.toml` declares, rather than whatever this job
        # happens to have installed. Two reasons: the installed set includes the wheel built a few
        # steps above, which is not on PyPI and makes `--strict` fail on "could not be audited";
        # and the ranges are what an operator actually resolves, so they are the thing worth
        # knowing about.
        run: |
          set -euo pipefail
          python - > requirements-audit.txt <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          for requirement in data["project"]["dependencies"]:
              print(requirement)
          PY
          cat requirements-audit.txt
          pip-audit --strict --progress-spinner off -r requirements-audit.txt

      - name: Nothing that looks like a credential or a private host
        # A public repository holding a key, a token or a real deployment address would be the
        # failure this repository exists to make visible. Written out here rather than delegated to
        # a third-party action: an action would run with more access than this needs, and a reader
        # can check a grep.
        run: |
          set -euo pipefail
          patterns='-----BEGIN [A-Z ]*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|xox[abprs]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{16}|[a-z0-9][a-z0-9-]*\.tail[0-9a-z]+\.ts\.net|inv_[A-Za-z0-9_-]{12,}|-----BEGIN AGE ENCRYPTED FILE-----'
          # -e, because the first pattern starts with `-----` and git would otherwise read it
          # as an option and fail with a usage message instead of searching.
          if git grep -nIE -e "${patterns}" -- . ':!.github/workflows/ci.yml'; then
            echo "REFUSED: the tree contains something shaped like a credential or a private host." >&2
            exit 1
          fi
          echo "No key armour, token, tailnet host or invitation value in the tree."

      - name: Every tracked file is declared
        # `docs/MIRROR.md` says this repository holds two kinds of file: the published ones, which
        # an operator installs or reads, and a short declared list that only serves this
        # repository. Anything else is a third kind nobody decided on, and the cheapest moment to
        # notice one is before it is merged.
        run: |
          set -euo pipefail
          undeclared="$(git ls-files | grep -vE \
            '^(src/agentnexus_sdk/|installers/|connector-release/|docs/(BEHAVIOUR|INSTALL|VERIFY|TROUBLESHOOTING)\.md$|README\.md$|SECURITY\.md$|LICENSE$|pyproject\.toml$)' \
            | grep -vE '^(\.github/|ci/|scripts/build_release\.py$|\.gitignore$|constraints-ci\.txt$|ruff\.toml$|docs/(MIRROR|README)\.md$|docs/ai/(CONNECTOR_AUTOMATIC_UPDATE_SAFETY_PLAN|CONNECTOR_RELEASE_READINESS|PROFILE_MIGRATION_SLICE|PUBLIC_CONNECTOR_RELEASE_REPOSITORY_PLAN|REVIEW_C3B_REQUEST_UPDATE_SAFETY|RUNTIME_MODEL_DECLARATION_PLAN|SOUL_APPLICATION_HANDOFF)\.md$|docs/integration/(CONNECTOR|CONNECTOR_RELEASE_0_5_0_NOTES|PROFILE_MIGRATION|PROFILE_MIGRATION_ACCEPTANCE)\.md$|docs/releases/(connector-0\.5\.0|connector-0\.6\.0|connector-0\.6\.1)\.md$|docs/releases/connector-release-state\.json$|AGENTS\.md$)' || true)"
          if [ -n "${undeclared}" ]; then
            echo "REFUSED: these files are neither mirrored nor declared repository-local:" >&2
            printf '%s\n' "${undeclared}" >&2
            echo "" >&2
            echo "Add them to docs/MIRROR.md deliberately, or remove them." >&2
            exit 1
          fi
          echo "Every tracked file is either mirrored or declared repository-local."
